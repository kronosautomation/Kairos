# Kairos CI — runs on every pull request and every push to main.
# Fast, deterministic layers of docs/TEST-STRATEGY.md. Long runs live in build/azure-pipelines-nightly.yml.

trigger:
  branches:
    include: [ main ]
pr:
  branches:
    include: [ main ]

parameters:
- name: targets
  type: object
  default:
  - { name: net10, label: '10', sdk: '10.0.x', tfm: net10.0, locked: 'true', blocking: true }
  # Non-blocking until .NET 11 GA (expected Nov 2026). Lock files are generated for net10.0, so restore unlocked here.
  - { name: net11, label: '11 (Runtime Async)', sdk: '11.0.x', tfm: net11.0, locked: 'false', blocking: false }

variables:
  CI: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
  KAIROS_SIM_SEEDS: '1000'          # deterministic simulation seeds per commit
  BuildConfiguration: Release

stages:
- stage: Test
  displayName: Build and test
  jobs:
  - ${{ each t in parameters.targets }}:
    - job: Test_${{ t.name }}
      displayName: Test (.NET ${{ t.label }})
      continueOnError: ${{ not(t.blocking) }}
      pool:
        vmImage: ubuntu-latest        # Docker is available, so Testcontainers (Postgres) works
      timeoutInMinutes: 45
      steps:
      - checkout: self
        fetchDepth: 1

      # The SDK is the one global.json names, exactly: lock files and compiler output depend on it (docs/RELEASE.md, "Pinned toolchain").
      - task: UseDotNet@2
        displayName: Install the .NET SDK from global.json
        inputs:
          packageType: sdk
          useGlobalJson: true

      - ${{ if ne(t.sdk, '10.0.x') }}:
        - task: UseDotNet@2
          displayName: Install .NET ${{ t.label }} SDK
          inputs:
            packageType: sdk
            version: ${{ t.sdk }}
            includePreviewVersions: true
        - script: rm global.json
          displayName: Build with the newer SDK (this non-blocking job is the only one that does not use the pinned one)

      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | ${{ t.tfm }} | **/packages.lock.json,!**/bin/**,!**/obj/**'
          restoreKeys: |
            nuget | "$(Agent.OS)" | ${{ t.tfm }}
          path: $(NUGET_PACKAGES)

      - script: dotnet restore Kairos.sln -p:KairosTargetFramework=${{ t.tfm }} -p:RestoreLockedMode=${{ t.locked }}
        displayName: Restore

      - script: dotnet build Kairos.sln -c $(BuildConfiguration) --no-restore -p:KairosTargetFramework=${{ t.tfm }}
        displayName: Build (warnings are errors)

      - script: >
          dotnet test Kairos.sln -c $(BuildConfiguration) --no-build -p:KairosTargetFramework=${{ t.tfm }}
          --filter "Category!=Nightly&Category!=Soak&Category!=CloudSandbox"
          --logger trx --results-directory $(Agent.TempDirectory)/TestResults
          --collect "XPlat Code Coverage"
        displayName: Unit, property, simulation (1,000 seeds), crash-at-every-step, Postgres integration

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
          testRunTitle: 'Kairos .NET ${{ t.label }}'
          failTaskOnFailedTests: true

      - ${{ if eq(t.tfm, 'net10.0') }}:
        - task: PublishCodeCoverageResults@2
          displayName: Publish coverage
          condition: succeededOrFailed()
          inputs:
            summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

      - publish: $(Agent.TempDirectory)/TestResults
        artifact: test-failures-${{ t.name }}-$(System.JobAttempt)
        displayName: Keep failing simulation seeds and logs
        condition: failed()

- stage: Model
  displayName: TLA+ model (quick)
  dependsOn: []
  jobs:
  - job: ModelQuick
    pool:
      vmImage: ubuntu-latest
    timeoutInMinutes: 15
    steps:
    - checkout: self
      fetchDepth: 1
    - script: |
        set -euo pipefail
        curl -fsSL "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" -o "$(Agent.TempDirectory)/tla2tools.jar"
        echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $(Agent.TempDirectory)/tla2tools.jar" | sha1sum -c -
        TLC_MODE=quick TLA2TOOLS="$(Agent.TempDirectory)/tla2tools.jar" bash spec/check.sh
      displayName: Model-check spec/ (quick config)

- stage: Docs
  displayName: Documentation site
  dependsOn: []
  jobs:
  - job: DocFX
    displayName: Disclosure check, then build the site
    pool:
      vmImage: ubuntu-latest
    timeoutInMinutes: 20
    steps:
    - checkout: self
      fetchDepth: 1
    - pwsh: ./build/check-disclosure.ps1 -SelfTest
      displayName: Disclosure check can fail (self-test)
    - pwsh: ./build/check-disclosure.ps1
      displayName: Disclosure policy check (docs-site/, samples/, public XML comments), before the site is built
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        useGlobalJson: true
    - script: dotnet tool restore
      displayName: Restore pinned DocFX
    - script: dotnet restore Kairos.sln -p:RestoreLockedMode=true
      displayName: Locked restore
    - script: dotnet build Kairos.sln -c $(BuildConfiguration) --no-restore
      displayName: Build (compiles every sample the pages quote; writes the XML docs)
    - script: dotnet docfx docs-site/docfx.json --warningsAsErrors
      displayName: Build the site (warnings, including broken links and missing snippets, are errors)
    - publish: docs-site/_site
      artifact: docs-site
      displayName: Keep the built site

- stage: SupplyChain
  displayName: Supply chain checks
  dependsOn: []
  jobs:
  - job: Audit
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        useGlobalJson: true
    - script: dotnet restore Kairos.sln -p:RestoreLockedMode=true
      displayName: Locked restore (NuGetAudit fails on high/critical)
    - script: |
        set -euo pipefail
        dotnet list Kairos.sln package --vulnerable --include-transitive | tee vuln.txt
        if grep -qE "\b(High|Critical)\b" vuln.txt; then echo "##vso[task.logissue type=error]High/critical vulnerable package"; exit 1; fi
      displayName: Vulnerable package report
    - script: |
        set -euo pipefail
        # Fail if anything that looks like a secret was committed.
        if git grep -nE "(Password|Pwd|AccountKey|SharedAccessKey|client_secret|BEGIN (RSA |EC )?PRIVATE KEY)\s*[=:]" -- . ':!docs/**' ':!*.md'; then
          echo "##vso[task.logissue type=error]Possible secret in source"; exit 1; fi
      displayName: Secret pattern scan
    - pwsh: ./docker/pin-images.ps1 -Check
      displayName: Every container image pinned to a digest
