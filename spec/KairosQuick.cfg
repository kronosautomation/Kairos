\* Per-commit configuration: one run, one crash, one premature expiry. Same invariants and properties as Kairos.cfg,
\* small enough to finish in seconds. The full Kairos.cfg (two runs, two crashes, two expiries) runs nightly.
SPECIFICATION Spec
CONSTANTS
    Runs = {r1}
    MaxSignals = 1
    MaxExpiries = 1
    MaxCrashes = 1
    ActFencing = TRUE
INVARIANTS TypeOK I2 I3 I9
PROPERTIES AppendOnly Liveness
