\* Mutation: activity completions ignore the fencing token. Expected: TLC reports an I2 violation (a result recorded twice).
\* If this passes, the model has stopped checking fencing and needs fixing.
SPECIFICATION Spec
CONSTANTS
    Runs = {r1}
    MaxSignals = 1
    MaxExpiries = 2
    MaxCrashes = 0
    ActFencing = FALSE
INVARIANTS TypeOK I2
